{{- with .Values.policies.readonlyRootFilesystem }}
{{- if .enabled }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-readonly-root-filesystem
  labels:
    {{- include "course-policies.labels" $ | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Require read-only root filesystem
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
spec:
  background: true
  rules:
    - name: check-readonly-root-filesystem
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        failureAction: {{ .failureAction }}
        message: "Containers must set securityContext.readOnlyRootFilesystem to true."
        pattern:
          spec:
            =(ephemeralContainers):
              - securityContext:
                  readOnlyRootFilesystem: true
            =(initContainers):
              - securityContext:
                  readOnlyRootFilesystem: true
            containers:
              - securityContext:
                  readOnlyRootFilesystem: true
{{- end }}
{{- end }}
