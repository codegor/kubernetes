---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-dashboards
  namespace: argocd
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    path: module-05-observability
    directory:
      recurse: true
      include: "{task-2-node-load-dashboard/*-configmap.yaml,task-3-readonly-audit-alert/*-configmap.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
{{- include "apps.monitoringSync" . }}
