apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: student-istio-sidecar
  annotations:
    policies.kyverno.io/title: Istio sidecar for students
    policies.kyverno.io/category: Service Mesh
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Pods labelled person=student get sidecar.istio.io/inject=true, so the Istio
      injector adds the istio-proxy sidecar. Relies on istiod
      sidecarInjectorWebhook.reinvocationPolicy=IfNeeded
      (module-04-service-mesh/task-1-istio/istiod-values.yaml).
    # The person label is set on the Pod by add-person-label; match Pods only.
    pod-policies.kyverno.io/autogen-controllers: none
spec:
  rules:
    - name: inject-istio-sidecar
      match:
        any:
          - resources:
              kinds: [Pod]
              selector:
                matchLabels:
                  person: student
      mutate:
        patchStrategicMerge:
          metadata:
            labels:
              sidecar.istio.io/inject: "true"
