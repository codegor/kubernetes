apiVersion: apps/v1
kind: Deployment
metadata:
  name: mesh-test
  namespace: student03
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mesh-test
  template:
    metadata:
      labels:
        app: mesh-test
    spec:
      containers:
        - name: app
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
